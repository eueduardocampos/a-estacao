<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Estação · opções visuais</title>
  <link rel="icon" href="icone-64.png">
  <!-- Página de comparação: carrega a Estação normal (estilos e corpo copiados de
       index.html em tempo de execução, depois main.js) e aplica as opções de
       opcoes-visuais.js. Não altera nenhum arquivo do app.
       Ex.: ?opcao=passadeira-fibra&simular=4&quadro=corredor&limpo=1 -->
  <script type="importmap">
    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body { background: radial-gradient(ellipse at 50% 35%, #d9d4ea, #a99fca); font-family: "Figtree", -apple-system, sans-serif; }
    #rotulo-opcao {
      position: fixed; left: 20px; bottom: 14px; z-index: 5;
      font: 700 12px Figtree, -apple-system, sans-serif; color: #fff; background: #030870;
      padding: 5px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(3,8,112,.18);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <script type="module">
    const params = new URLSearchParams(location.search);
    // enquadramento fixo pede a câmera livre (o "Seguindo" moveria a câmera sozinho)
    if (params.has('quadro') && !params.has('zoom')) {
      params.set('zoom', 'livre');
      history.replaceState(null, '', location.pathname + '?' + params.toString());
    }
    // copia estilos, fontes e corpo da página normal, sem os scripts
    const html = await (await fetch('./index.html', { cache: 'no-store' })).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    for (const el of doc.head.querySelectorAll('style, link[rel="stylesheet"], link[rel="preconnect"]')) {
      document.head.append(document.importNode(el, true));
    }
    for (const el of [...doc.body.children]) {
      if (el.tagName !== 'SCRIPT') document.body.append(document.importNode(el, true));
    }
    const nomes = {
      'passadeira-vermelha': 'Passadeira vermelha (atual)', 'passadeira-fibra': 'Passadeira de fibra',
      'sem-passadeira': 'Sem passadeira', 'parede-lisa': 'Parede lisa (atual)',
      'parede-tijolo': 'Parede de tijolo, letras claras', 'parede-tijolo-faixa': 'Parede de tijolo, faixa clara',
    };
    const escolhidas = params.getAll('opcao').flatMap(v => v.split(',')).filter(Boolean);
    if (escolhidas.length) {
      const r = document.createElement('div');
      r.id = 'rotulo-opcao';
      r.textContent = escolhidas.map(o => nomes[o] ?? o).join(' · ');
      document.body.append(r);
    }
    await Promise.all([import('./main.js'), import('./opcoes-visuais.js')]);
  </script>
</body>
</html>
